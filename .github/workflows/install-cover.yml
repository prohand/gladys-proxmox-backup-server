name: Install integration cover

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-cover.yml

permissions:
  contents: write

jobs:
  install-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write cover and update manifest
        env:
          COVER_B64: |
            
        run: |
          printf '%s' "$COVER_B64" | base64 --decode > cover.png
          node -e "const fs=require('fs');const p='gladys-assistant-integration.json';let s=fs.readFileSync(p,'utf8');const old='https://raw.githubusercontent.com/GladysAssistant/integration-template-js/master/cover.png';const next='https://raw.githubusercontent.com/prohand/gladys-proxmox-backup-server/main/cover.png';s=s.replace(old,next);if(!s.includes(next))process.exit(1);fs.writeFileSync(p,s);"
          rm .github/workflows/install-cover.yml

      - name: Verify generated files
        run: |
          test "$(file --brief --mime-type cover.png)" = "image/png"
          grep -q 'prohand/gladys-proxmox-backup-server/main/cover.png' gladys-assistant-integration.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- cover.png gladys-assistant-integration.json .github/workflows/install-cover.yml
          git commit -m "chore: add integration cover image"
          git push
