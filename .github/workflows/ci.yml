# -----------------------------------------------------------------------------
# Continuous integration: runs on every push and every pull request.
#
# Three gates, the same ones every developer inspired by this template should
# keep:
#   1. Prettier  -> consistent formatting (no style debates in reviews);
#   2. ESLint    -> catch real mistakes (undefined vars, dead code, ...);
#   3. Tests     -> `node --test`, the built-in runner (no extra dependency).
#
# Runs on Node 24 only: it is both the `engines` floor and the version the
# Docker image ships with, so the check exercises the exact runtime.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Lint & test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm test

  docker:
    # Builds the image on pull requests without pushing it, so a broken
    # Dockerfile (a file missing from the COPY list, a failing `npm ci`) shows up
    # before a release tries to publish it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Docker build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (amd64, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false

  store:
    # The store indexer's own admission checks (manifest schema, version
    # couplings, cover, image). Pull requests only: a release commit reaches main
    # before build.yml has pushed its image, and the check refuses a missing one.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Store admission checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate like the store indexer
        run: npx --yes github:GladysAssistant/integration-store .
